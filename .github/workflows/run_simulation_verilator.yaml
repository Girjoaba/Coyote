# A work-flow for running the Coyote software examples in simulation under Verilator (sim/vl/build.sh),
# next to run_simulation.yaml (xsim). Vivado still writes the simulation project (make sim); Verilator runs it.
name: Run simulation with Verilator

on:
  pull_request:
    branches:
    - master

defaults:
  run:
    shell: bash -ileo pipefail {0}

jobs:
  run-01-hello-world:
    environment: fpga-synth
    runs-on: [self-hosted, linux, x64]

    steps:
    - uses: actions/checkout@v4

    - name: Environment set-up
      run:
        mkdir examples/01_hello_world/build_sim && mkdir examples/01_hello_world/build_sw && sudo apt-get install libboost-all-dev

    - name: Verilator
      run: |
        source sim/vl/verilator.env   # the pin: VERILATOR_REF
        sim/vl/install_verilator.sh $HOME/opt/verilator/$VERILATOR_REF   # does nothing when the prefix holds it
        echo "$HOME/opt/verilator/$VERILATOR_REF/bin" >> $GITHUB_PATH

    - name: Make simulation project
      run:
        cd examples/01_hello_world/build_sim && cmake -DFDEV_NAME=u55c -DUNIT_TEST_DIR=$GITHUB_WORKSPACE/sim/unit_test/examples ../hw && make sim

    - name: Make software project
      run:
        cd examples/01_hello_world/build_sw && cmake ../sw -DEN_SIM=ON && make

    - name: Build the testbench with Verilator
      run:
        sim/vl/build.sh examples/01_hello_world/build_sim examples/01_hello_world/build_vl

    - name: Run simulation
      run: |
        COYOTE_SIM_BIN=$PWD/examples/01_hello_world/build_vl/coyote_vl COYOTE_SIM_DIR=examples/01_hello_world/build_sim/ examples/01_hello_world/build_sw/test -X 1024 -r 1 -s 0
        COYOTE_SIM_BIN=$PWD/examples/01_hello_world/build_vl/coyote_vl COYOTE_SIM_DIR=examples/01_hello_world/build_sim/ examples/01_hello_world/build_sw/test -X 1024 -r 1 -s 1

    - name: Run the Python tests under Verilator
      run:
        COYOTE_SIM_VERILATOR=1 PYTHONPATH=$PWD/examples/01_hello_world/build_sim:$PWD/sim python3 -m unittest discover -v -s sim/unit_test/examples

